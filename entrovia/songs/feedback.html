<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回饋表單 ｜ 安特羅迦歌單站</title>
  <link rel="icon" href="icon.png?v=2" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #333;
      --card: rgba(255, 255, 255, 0.92);
      --border: rgba(224, 224, 224, 0.6);
      --text-main: #222;
      --text-sub: #666;
      --text-light: #aaa;
      --accent: #555;
      --bg-overlay: rgba(244, 246, 248, 0.55);
      --btn-bg: #f1f1f1;
      --btn-border: #ddd;
      --input-bg: white;
      --primary-text-inv: white;
      --shadow: rgba(0,0,0,0.08);
      --success: #2e7d32;
      --error: #c62828;
      --brand-purple: #8c6fc9;
      --brand-red: #c23e73;
      --brand-blue: #4b7fe0;
    }
    [data-theme="dark"] {
      --primary: #e0e0e0;
      --card: rgba(36, 38, 44, 0.9);
      --border: rgba(80, 80, 90, 0.5);
      --text-main: #e8e8e8;
      --text-sub: #aaa;
      --text-light: #777;
      --accent: #bbb;
      --bg-overlay: rgba(18, 20, 26, 0.62);
      --btn-bg: #3a3d44;
      --btn-border: #4d5058;
      --input-bg: #2c2f36;
      --primary-text-inv: #1a1c20;
      --shadow: rgba(0,0,0,0.4);
      --success: #66bb6a;
      --error: #ef5350;
      --brand-purple: #b48aff;
      --brand-red: #f85a8f;
      --brand-blue: #7aacff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      background-image:
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url("bg.svg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      line-height: 1.6;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px var(--shadow);
    }
    .back-link {
      display: inline-block;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .back-link:hover { color: var(--primary); }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--border);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-group label .req { color: #c62828; }
    .form-group label .hint {
      font-weight: normal;
      color: var(--text-light);
      font-size: 12px;
      margin-left: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border 0.15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--brand-purple);
      box-shadow: 0 0 0 2px rgba(140, 111, 201, 0.2);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: var(--primary-text-inv);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, var(--brand-red), var(--brand-purple));
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(216, 69, 111, 0.4);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .notice {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      line-height: 1.7;
    }

    /* 成功畫面 */
    .success-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-screen.show { display: block; }
    .success-screen .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    .success-screen h2 {
      margin: 0 0 10px 0;
      color: var(--success);
    }
    .success-screen p {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .success-screen .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .success-screen button {
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--btn-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }
    .success-screen button:hover { background: var(--btn-bg); }
    .success-screen button.primary {
      background: var(--primary);
      color: var(--primary-text-inv);
      border-color: var(--primary);
    }
  </style>
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('antrovia_theme');
        if (stored === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>

<div class="card" id="form-card">
  <a href="./" class="back-link">← 返回歌單站</a>
  <h1>📝 回饋表單</h1>
  <div class="subtitle">
    發現 bug、歌單資訊錯誤、或有功能建議嗎?歡迎讓我知道!<br>
    所有回饋都會進入待處理清單,我會盡快查看。
  </div>

  <form id="feedback-form">
    <div class="form-group">
      <label>類別 <span class="req">*</span></label>
      <select id="f-category" required>
        <option value="bug">🐛 Bug 回報(網站壞了 / 行為異常)</option>
        <option value="content">📝 歌單內容錯誤(時間軸 / 歌名 / 原唱)</option>
        <option value="feature">💡 功能建議</option>
        <option value="other">💬 其他</option>
      </select>
    </div>

    <div class="form-group">
      <label>標題 <span class="hint">(簡短描述,選填)</span></label>
      <input type="text" id="f-title" placeholder="例如:插播按鈕沒反應">
    </div>

    <div class="form-group">
      <label>詳細描述 <span class="req">*</span></label>
      <textarea id="f-content" required placeholder="詳細描述遇到的問題或想法,例如:&#10;- 操作步驟&#10;- 使用的裝置與瀏覽器&#10;- 預期的結果 vs 實際結果"></textarea>
    </div>

    <div class="form-group">
      <label>你的名字 <span class="hint">(選填)</span></label>
      <input type="text" id="f-name" placeholder="方便回饋後署名">
    </div>

    <div class="form-group">
      <label>聯絡方式 <span class="hint">(選填,若希望回覆請留)</span></label>
      <input type="text" id="f-contact" placeholder="例如:X / Discord / Email">
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">送出回饋</button>
  </form>

  <div class="notice">
    💡 說明:
    <ul style="margin:6px 0; padding-left:20px;">
      <li>Bug 回報請盡量描述清楚操作步驟與裝置</li>
      <li>內容錯誤請附上該首歌名與直播日期</li>
      <li>功能建議歡迎提,但不保證都會做</li>
    </ul>
  </div>
</div>

<div class="card success-screen" id="success-screen">
  <div class="icon">✅</div>
  <h2>回饋已送出!</h2>
  <p>感謝你的回饋,我會盡快查看與處理。</p>
  <div class="buttons">
    <button onclick="window.location.href='./'">返回歌單站</button>
    <button class="primary" onclick="resetForm()">再送出一則</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyiBdjR4ZU_XFM9lond22fk7CR5ZtDub3Q07h8LMp4w-JDCeXOFItLeflBLZktDMtYbPA/exec";

  document.getElementById('feedback-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = '送出中...';

    // 所有欄位打包成 base64 當單一 z 參數,Google heuristic 看到亂碼不會擋
    const payload = {
      c: document.getElementById('f-category').value,
      t: document.getElementById('f-title').value,
      d: document.getElementById('f-content').value,
      n: document.getElementById('f-name').value,
      co: document.getElementById('f-contact').value
    };
    const json = JSON.stringify(payload);
    // UTF-8 safe base64(處理中文)
    const encoded = btoa(unescape(encodeURIComponent(json)));
    const params = new URLSearchParams();
    params.set('a', 'rpt');
    params.set('z', encoded);

    // Image beacon 送出(避開 CORS)
    const img = new Image();
    img.src = GAS_URL + '?' + params.toString();

    // 樂觀 UI:800ms 後顯示成功畫面
    setTimeout(() => {
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('success-screen').classList.add('show');
    }, 800);
  });

  function resetForm() {
    document.getElementById('feedback-form').reset();
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').innerText = '送出回饋';
    document.getElementById('form-card').style.display = 'block';
    document.getElementById('success-screen').classList.remove('show');
  }
</script>

<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5a64faae6c634fe4a86910f6b2d8f51d"}'></script>

</body>
</html>
