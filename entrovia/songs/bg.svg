<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- 主背景漸層:中心微亮往外變深 -->
    <radialGradient id="bgRad" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#2d2142"/>
      <stop offset="40%" stop-color="#1a1428"/>
      <stop offset="100%" stop-color="#070512"/>
    </radialGradient>

    <!-- 中央光束:直直的垂直發光帶 -->
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8c7bc9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#9b85d6" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#c3a8ff" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#9b85d6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8c7bc9" stop-opacity="0"/>
    </linearGradient>

    <!-- 底部波形漸層 -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b4ba3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2d1b4a" stop-opacity="0.35"/>
    </linearGradient>

    <!-- 星粒子的 glow blur -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="hardGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- 散光粒子 symbol,方便重複使用 -->
    <symbol id="dust" overflow="visible">
      <circle r="1" fill="#e8d9ff"/>
    </symbol>
  </defs>

  <!-- 底色漸層 -->
  <rect width="1920" height="1080" fill="url(#bgRad)"/>

  <!-- 大面積漫射光暈,呼應「寂靜」 -->
  <circle cx="960" cy="500" r="700" fill="#5c3f8f" opacity="0.08" filter="url(#hardGlow)"/>
  <circle cx="400" cy="800" r="320" fill="#4a2d7a" opacity="0.07" filter="url(#hardGlow)"/>
  <circle cx="1540" cy="300" r="260" fill="#5c3f8f" opacity="0.06" filter="url(#hardGlow)"/>

  <!-- 中央光束,象徵「秩序中的方向」 -->
  <rect x="958" y="0" width="4" height="1080" fill="url(#beam)"/>
  <rect x="946" y="0" width="28" height="1080" fill="url(#beam)" opacity="0.4"/>

  <!-- 粒子群(隨機散佈,大小不一,呼應「熵」) -->
  <g filter="url(#softGlow)">
    <!-- 近距離的大粒子 -->
    <circle cx="340" cy="180" r="2.5" fill="#f0e4ff" opacity="0.9"/>
    <circle cx="780" cy="120" r="2" fill="#e0d1ff" opacity="0.85"/>
    <circle cx="1420" cy="200" r="2.5" fill="#f0e4ff" opacity="0.9"/>
    <circle cx="1680" cy="400" r="2" fill="#e0d1ff" opacity="0.8"/>
    <circle cx="240" cy="520" r="2.5" fill="#f0e4ff" opacity="0.85"/>
    <circle cx="580" cy="740" r="2" fill="#e0d1ff" opacity="0.85"/>
    <circle cx="1180" cy="820" r="2.5" fill="#f0e4ff" opacity="0.9"/>
    <circle cx="1760" cy="880" r="2" fill="#e0d1ff" opacity="0.8"/>
    
    <!-- 中距離粒子 -->
    <circle cx="160" cy="90" r="1.5" fill="#c3a8e8" opacity="0.75"/>
    <circle cx="520" cy="250" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="880" cy="340" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="1120" cy="90" r="1.5" fill="#c3a8e8" opacity="0.75"/>
    <circle cx="1260" cy="440" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="1580" cy="600" r="1.5" fill="#c3a8e8" opacity="0.75"/>
    <circle cx="1850" cy="150" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="60" cy="340" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="420" cy="440" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="700" cy="580" r="1.5" fill="#c3a8e8" opacity="0.75"/>
    <circle cx="1020" cy="620" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="1340" cy="700" r="1.5" fill="#c3a8e8" opacity="0.7"/>
    <circle cx="1620" cy="760" r="1.5" fill="#c3a8e8" opacity="0.75"/>
    <circle cx="1880" cy="620" r="1.5" fill="#c3a8e8" opacity="0.7"/>
  </g>

  <!-- 遠距離塵埃(很多很細) -->
  <g opacity="0.5">
    <circle cx="80" cy="200" r="0.8" fill="#a899c7"/>
    <circle cx="190" cy="640" r="0.8" fill="#a899c7"/>
    <circle cx="260" cy="420" r="0.8" fill="#a899c7"/>
    <circle cx="310" cy="60" r="0.8" fill="#a899c7"/>
    <circle cx="380" cy="340" r="0.8" fill="#a899c7"/>
    <circle cx="470" cy="140" r="0.8" fill="#a899c7"/>
    <circle cx="540" cy="820" r="0.8" fill="#a899c7"/>
    <circle cx="620" cy="490" r="0.8" fill="#a899c7"/>
    <circle cx="690" cy="310" r="0.8" fill="#a899c7"/>
    <circle cx="760" cy="900" r="0.8" fill="#a899c7"/>
    <circle cx="820" cy="60" r="0.8" fill="#a899c7"/>
    <circle cx="900" cy="500" r="0.8" fill="#a899c7"/>
    <circle cx="980" cy="700" r="0.8" fill="#a899c7"/>
    <circle cx="1060" cy="280" r="0.8" fill="#a899c7"/>
    <circle cx="1140" cy="520" r="0.8" fill="#a899c7"/>
    <circle cx="1210" cy="100" r="0.8" fill="#a899c7"/>
    <circle cx="1280" cy="880" r="0.8" fill="#a899c7"/>
    <circle cx="1360" cy="350" r="0.8" fill="#a899c7"/>
    <circle cx="1440" cy="580" r="0.8" fill="#a899c7"/>
    <circle cx="1510" cy="80" r="0.8" fill="#a899c7"/>
    <circle cx="1600" cy="440" r="0.8" fill="#a899c7"/>
    <circle cx="1680" cy="900" r="0.8" fill="#a899c7"/>
    <circle cx="1740" cy="520" r="0.8" fill="#a899c7"/>
    <circle cx="1800" cy="280" r="0.8" fill="#a899c7"/>
    <circle cx="1880" cy="760" r="0.8" fill="#a899c7"/>
    <circle cx="100" cy="760" r="0.8" fill="#a899c7"/>
    <circle cx="430" cy="700" r="0.8" fill="#a899c7"/>
    <circle cx="860" cy="200" r="0.8" fill="#a899c7"/>
    <circle cx="1300" cy="200" r="0.8" fill="#a899c7"/>
    <circle cx="1500" cy="320" r="0.8" fill="#a899c7"/>
  </g>

  <!-- 底部音波波形,呼應音樂播放主題 -->
  <path d="M 0,780 
           Q 160,760 320,790 
           T 640,785
           T 960,775
           T 1280,790
           T 1600,780
           T 1920,785
           L 1920,1080 L 0,1080 Z" 
        fill="url(#waveGrad)"/>
  
  <!-- 更淺的第二層波形,錯位疊加增加層次 -->
  <path d="M 0,850 
           Q 200,830 400,860 
           T 800,855
           T 1200,850
           T 1600,860
           T 1920,850
           L 1920,1080 L 0,1080 Z" 
        fill="url(#waveGrad)" opacity="0.6"/>

  <!-- 右下角的 ≠ 符號,呼應「Para≠dox」設定(極淡,幾乎隱藏) -->
  <text x="1830" y="1040" font-size="120" font-family="serif" font-weight="100"
        fill="#8c7bc9" opacity="0.06" text-anchor="end">≠</text>

  <!-- 左上角的小方格陣,象徵「有序中的碎片」-->
  <g opacity="0.08" stroke="#8c7bc9" stroke-width="0.5" fill="none">
    <rect x="50" y="50" width="12" height="12"/>
    <rect x="65" y="65" width="8" height="8"/>
    <rect x="80" y="55" width="10" height="10"/>
    <rect x="55" y="75" width="6" height="6"/>
  </g>
</svg>
