<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- 左側紅紫光源 -->
    <radialGradient id="redSource" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e04680" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#c23e73" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b2a5c" stop-opacity="0"/>
    </radialGradient>
    <!-- 右側藍紫光源 -->
    <radialGradient id="blueSource" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a93ff" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#4b7fe0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2a3dab" stop-opacity="0"/>
    </radialGradient>
    <!-- 中央紫色融合區 -->
    <radialGradient id="centerFusion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c3a8ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8c6fc9" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部波形:紅紫→藍紫漸變 -->
    <linearGradient id="waveRedBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8456f" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#a85ba3" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8c6fc9" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#6a7bd6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4b7fe0" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="waveDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b2a5c" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#5a2e8f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a3dab" stop-opacity="0.4"/>
    </linearGradient>
    <!-- 等化器柱 -->
    <linearGradient id="barRedT" x1="0" y1="0%" x2="0" y2="100%">
      <stop offset="0%" stop-color="#d8456f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d8456f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barBlueT" x1="0" y1="0%" x2="0" y2="100%">
      <stop offset="0%" stop-color="#5a93ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5a93ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barRedB" x1="0" y1="100%" x2="0" y2="0%">
      <stop offset="0%" stop-color="#d8456f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d8456f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barBlueB" x1="0" y1="100%" x2="0" y2="0%">
      <stop offset="0%" stop-color="#5a93ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5a93ff" stop-opacity="0"/>
    </linearGradient>
    <!-- 流動聲波曲線漸層 -->
    <linearGradient id="flowStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8456f" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#b48aff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a93ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ===== 大型光源(紅/藍兩極 + 中央融合) ===== -->
  <circle cx="280" cy="340" r="720" fill="url(#redSource)"/>
  <circle cx="1640" cy="720" r="720" fill="url(#blueSource)"/>
  <circle cx="100" cy="900" r="460" fill="url(#redSource)" opacity="0.6"/>
  <circle cx="1800" cy="200" r="460" fill="url(#blueSource)" opacity="0.6"/>
  <circle cx="960" cy="540" r="520" fill="url(#centerFusion)"/>

  <!-- ===== 大型光芒亮點(像音響擴音器) ===== -->
  <g filter="url(#bigGlow)">
    <circle cx="340" cy="420" r="20" fill="#f85a8f" opacity="0.5"/>
    <circle cx="1580" cy="660" r="20" fill="#7aacff" opacity="0.5"/>
  </g>

  <!-- ===== 流動聲波曲線:三條從左到右的流動感 ===== -->
  <path d="M -50,440 Q 320,340 640,460 T 1280,440 T 1980,380"
        fill="none" stroke="url(#flowStroke)" stroke-width="2.5" opacity="0.6"/>
  <path d="M -50,560 Q 400,660 760,540 T 1400,620 T 1980,540"
        fill="none" stroke="url(#flowStroke)" stroke-width="2" opacity="0.5"/>
  <path d="M -50,640 Q 280,560 580,680 T 1180,660 T 1980,680"
        fill="none" stroke="url(#flowStroke)" stroke-width="1.5" opacity="0.4"/>

  <!-- ===== 底部主視覺:三層紅藍漸融波形 ===== -->
  <path d="M 0,860 Q 240,830 480,860 T 960,855 T 1440,860 T 1920,855 L 1920,1080 L 0,1080 Z"
        fill="url(#waveRedBlue)"/>
  <path d="M 0,920 Q 320,890 640,925 T 1280,920 T 1920,925 L 1920,1080 L 0,1080 Z"
        fill="url(#waveDeep)" opacity="0.7"/>
  <path d="M 0,980 Q 480,955 960,985 T 1920,980 L 1920,1080 L 0,1080 Z"
        fill="url(#waveRedBlue)" opacity="0.5"/>

  <!-- ===== 頂部等化器柱:左紅右藍漸變 ===== -->
  <g>
    <rect x="100"  y="0" width="22" height="130" fill="url(#barRedT)"/>
    <rect x="170"  y="0" width="22" height="80"  fill="url(#barRedT)"/>
    <rect x="260"  y="0" width="22" height="200" fill="url(#barRedT)"/>
    <rect x="340"  y="0" width="22" height="120" fill="url(#barRedT)"/>
    <rect x="420"  y="0" width="22" height="180" fill="url(#barRedT)"/>
    <rect x="520"  y="0" width="22" height="90"  fill="url(#barRedT)"/>
    <rect x="620"  y="0" width="22" height="160" fill="url(#barRedT)"/>
    <rect x="720"  y="0" width="22" height="110" fill="url(#barRedT)"/>
    <rect x="820"  y="0" width="22" height="170" fill="url(#barRedT)"/>
    <rect x="1080" y="0" width="22" height="140" fill="url(#barBlueT)"/>
    <rect x="1180" y="0" width="22" height="200" fill="url(#barBlueT)"/>
    <rect x="1280" y="0" width="22" height="110" fill="url(#barBlueT)"/>
    <rect x="1380" y="0" width="22" height="170" fill="url(#barBlueT)"/>
    <rect x="1480" y="0" width="22" height="90"  fill="url(#barBlueT)"/>
    <rect x="1560" y="0" width="22" height="180" fill="url(#barBlueT)"/>
    <rect x="1660" y="0" width="22" height="120" fill="url(#barBlueT)"/>
    <rect x="1760" y="0" width="22" height="190" fill="url(#barBlueT)"/>
  </g>

  <!-- ===== 中段紅藍 vs 邊側等化器(讓紅左藍右更明顯) ===== -->
  <g opacity="0.65">
    <!-- 左側垂直等化器 -->
    <rect x="30"  y="420" width="18" height="140" fill="url(#barRedB)"/>
    <rect x="60"  y="380" width="18" height="200" fill="url(#barRedB)"/>
    <rect x="30"  y="620" width="18" height="100" fill="url(#barRedB)"/>
    <!-- 右側垂直等化器 -->
    <rect x="1872" y="400" width="18" height="180" fill="url(#barBlueB)"/>
    <rect x="1842" y="460" width="18" height="120" fill="url(#barBlueB)"/>
    <rect x="1872" y="620" width="18" height="140" fill="url(#barBlueB)"/>
  </g>

  <!-- ===== 左側紅粒子群(大小散佈) ===== -->
  <g filter="url(#softGlow)">
    <circle cx="180" cy="280" r="5" fill="#f85a8f" opacity="0.65"/>
    <circle cx="420" cy="380" r="4" fill="#f85a8f" opacity="0.6"/>
    <circle cx="620" cy="240" r="4" fill="#f85a8f" opacity="0.65"/>
    <circle cx="320" cy="580" r="5" fill="#f85a8f" opacity="0.6"/>
    <circle cx="520" cy="660" r="3" fill="#f85a8f" opacity="0.55"/>
    <circle cx="780" cy="420" r="4" fill="#f85a8f" opacity="0.6"/>
    <circle cx="840" cy="680" r="5" fill="#f85a8f" opacity="0.65"/>
  </g>
  <g opacity="0.5">
    <circle cx="60"  cy="420" r="2" fill="#d8456f"/>
    <circle cx="140" cy="560" r="2" fill="#d8456f"/>
    <circle cx="260" cy="180" r="2" fill="#d8456f"/>
    <circle cx="380" cy="700" r="2" fill="#d8456f"/>
    <circle cx="480" cy="300" r="2" fill="#d8456f"/>
    <circle cx="580" cy="500" r="2" fill="#d8456f"/>
    <circle cx="700" cy="340" r="2" fill="#d8456f"/>
    <circle cx="820" cy="200" r="2" fill="#d8456f"/>
    <circle cx="900" cy="580" r="2" fill="#d8456f"/>
  </g>

  <!-- ===== 右側藍粒子群(略整齊,呼應秩序) ===== -->
  <g filter="url(#softGlow)">
    <circle cx="1140" cy="260" r="4" fill="#7aacff" opacity="0.6"/>
    <circle cx="1300" cy="420" r="5" fill="#7aacff" opacity="0.65"/>
    <circle cx="1460" cy="280" r="4" fill="#7aacff" opacity="0.6"/>
    <circle cx="1620" cy="440" r="5" fill="#7aacff" opacity="0.65"/>
    <circle cx="1240" cy="620" r="3" fill="#7aacff" opacity="0.55"/>
    <circle cx="1400" cy="560" r="4" fill="#7aacff" opacity="0.6"/>
    <circle cx="1720" cy="580" r="4" fill="#7aacff" opacity="0.65"/>
  </g>
  <g opacity="0.5">
    <circle cx="1080" cy="200" r="2" fill="#4b7fe0"/>
    <circle cx="1200" cy="500" r="2" fill="#4b7fe0"/>
    <circle cx="1360" cy="220" r="2" fill="#4b7fe0"/>
    <circle cx="1480" cy="640" r="2" fill="#4b7fe0"/>
    <circle cx="1600" cy="200" r="2" fill="#4b7fe0"/>
    <circle cx="1700" cy="700" r="2" fill="#4b7fe0"/>
    <circle cx="1800" cy="340" r="2" fill="#4b7fe0"/>
    <circle cx="1880" cy="520" r="2" fill="#4b7fe0"/>
    <circle cx="1860" cy="700" r="2" fill="#4b7fe0"/>
  </g>

  <!-- ===== 中央融合區的紫色粒子 ===== -->
  <g filter="url(#softGlow)">
    <circle cx="920" cy="320" r="3" fill="#c3a8ff" opacity="0.5"/>
    <circle cx="980" cy="480" r="3" fill="#c3a8ff" opacity="0.5"/>
    <circle cx="950" cy="640" r="3" fill="#c3a8ff" opacity="0.5"/>
    <circle cx="1000" cy="200" r="2.5" fill="#c3a8ff" opacity="0.45"/>
  </g>
</svg>
